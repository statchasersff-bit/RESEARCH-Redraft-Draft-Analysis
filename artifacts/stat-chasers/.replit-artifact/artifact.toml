kind = "web"
previewPath = "/"
title = "StatChasers Redraft Analyzer"
version = "1.0.0"
id = "artifacts/stat-chasers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22582

[services.development]
run = "node /home/runner/workspace/artifacts/stat-chasers/node_modules/vite/bin/vite.js --config /home/runner/workspace/artifacts/stat-chasers/vite.config.static.ts --host 0.0.0.0"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stat-chasers", "run", "build" ]
publicDir = "artifacts/stat-chasers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22582"
BASE_PATH = "/"
